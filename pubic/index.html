<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>로또 제국: 원숭이 돌잡이</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ============ 1. 닉네임 입력 화면 ============ -->
<div id="screen-nickname" class="screen active">
  <div class="nick-wrap">
    <div class="monkey-hero">🐵</div>
    <h1 class="game-title">로또 제국<br><span class="sub-title">원숭이 돌잡이</span></h1>
    <p class="nick-desc">닉네임을 정하고 제국을 시작해봐!</p>
    <input id="nickname-input" type="text" maxlength="12" placeholder="닉네임 입력 (최대 12자)" />
    <button id="btn-start-game" class="btn-primary btn-lg">시작하기 🍌</button>
  </div>
</div>

<!-- ============ 2. 돌잡이 화면 ============ -->
<div id="screen-doljabi" class="screen">
  <div class="doljabi-wrap">
    <h2 class="doljabi-title">운명의 돌잡이!</h2>
    <p class="doljabi-desc">원숭이가 물건을 하나 고를 거야... 두근두근</p>
    <div id="doljabi-stage" class="doljabi-stage">
      <div id="doljabi-monkey" class="doljabi-monkey">🐵</div>
      <div id="doljabi-items" class="doljabi-items"></div>
      <div id="doljabi-effect" class="doljabi-effect"></div>
    </div>
    <button id="btn-doljabi-go" class="btn-primary btn-lg">돌잡이 시작! 🎲</button>
    <div id="doljabi-result" class="doljabi-result hidden">
      <div id="doljabi-result-icon" class="result-icon"></div>
      <div id="doljabi-result-name" class="result-name"></div>
      <div id="doljabi-result-desc" class="result-desc"></div>
      <button id="btn-doljabi-confirm" class="btn-primary btn-lg">이 운명으로 시작! ✨</button>
    </div>
  </div>
</div>

<!-- ============ 3. 메인 게임 화면 ============ -->
<div id="screen-main" class="screen">

  <!-- 상단 재화 바 -->
  <div class="top-bar">
    <div class="res-item"><span class="res-icon">💰</span><span id="res-money">0</span></div>
    <div class="res-item"><span class="res-icon">🍌</span><span id="res-banana">0</span></div>
    <div class="res-item"><span class="res-icon">🍀</span><span id="res-luck">0</span></div>
    <div class="res-item"><span class="res-icon">🔮</span><span id="res-fate">0</span></div>
    <button id="btn-settings" class="icon-btn">⚙️</button>
  </div>

  <!-- 내 운명 카드 -->
  <div id="my-fate-card" class="my-fate-card">
    <span id="my-fate-icon">🔮</span>
    <span id="my-fate-name">운명 로딩중...</span>
  </div>

  <!-- 이벤트 배너 -->
  <div id="event-banner" class="event-banner hidden"></div>

  <!-- 중앙: 미니 돌잡이 원숭이 (탭하면 수동 보상) -->
  <div class="center-stage">
    <div id="tap-monkey" class="tap-monkey">🐵</div>
    <div class="tap-hint">원숭이를 눌러서 보너스 획득!</div>
    <div id="floating-text-layer" class="floating-text-layer"></div>
  </div>

  <!-- 업그레이드 리스트 -->
  <div class="upgrade-panel">
    <div class="upgrade-row" data-upgrade="production">
      <div class="up-info">
        <div class="up-name">💰 생산량 업그레이드 <span class="up-lv" id="lv-production">Lv.1</span></div>
        <div class="up-desc">초당 자동 수익 증가</div>
      </div>
      <button class="btn-upgrade" data-key="production">
        <span class="up-cost" id="cost-production">10 💰</span>
      </button>
    </div>
    <div class="upgrade-row" data-upgrade="luck">
      <div class="up-info">
        <div class="up-name">🍀 행운 업그레이드 <span class="up-lv" id="lv-luck">Lv.1</span></div>
        <div class="up-desc">희귀 이벤트 확률 증가</div>
      </div>
      <button class="btn-upgrade" data-key="luck">
        <span class="up-cost" id="cost-luck">15 🍌</span>
      </button>
    </div>
    <div class="upgrade-row" data-upgrade="auto">
      <div class="up-info">
        <div class="up-name">⚙️ 자동화 업그레이드 <span class="up-lv" id="lv-auto">Lv.1</span></div>
        <div class="up-desc">방치 효율 증가</div>
      </div>
      <button class="btn-upgrade" data-key="auto">
        <span class="up-cost" id="cost-auto">20 💰</span>
      </button>
    </div>
    <div class="upgrade-row" data-upgrade="event">
      <div class="up-info">
        <div class="up-name">🎉 이벤트 강화 <span class="up-lv" id="lv-event">Lv.1</span></div>
        <div class="up-desc">병맛 이벤트 보상 증가</div>
      </div>
      <button class="btn-upgrade" data-key="event">
        <span class="up-cost" id="cost-event">25 🍀</span>
      </button>
    </div>
  </div>

  <!-- 하단 네비게이션 -->
  <div class="bottom-nav">
    <button id="nav-doljabi-summary" class="nav-btn">
      <span class="nav-icon">🎲</span><span class="nav-label">돌잡이</span>
    </button>
    <button id="nav-ranking" class="nav-btn">
      <span class="nav-icon">🏆</span><span class="nav-label">랭킹</span>
    </button>
    <button id="nav-friend" class="nav-btn">
      <span class="nav-icon">🤝</span><span class="nav-label">친구</span>
    </button>
    <button id="nav-daily" class="nav-btn">
      <span class="nav-icon">🎁</span><span class="nav-label">출석</span>
    </button>
    <button id="nav-tutorial" class="nav-btn">
      <span class="nav-icon">❓</span><span class="nav-label">도움말</span>
    </button>
  </div>
</div>

<!-- ============ 랭킹 모달 ============ -->
<div id="modal-ranking" class="modal hidden">
  <div class="modal-box">
    <div class="modal-header">
      <h3>🏆 랭킹</h3>
      <button class="modal-close" data-close="modal-ranking">✕</button>
    </div>
    <div class="tab-switch">
      <button id="tab-global" class="tab-btn active">전체 랭킹</button>
      <button id="tab-friend" class="tab-btn">친구 랭킹</button>
    </div>
    <div id="ranking-my-rank" class="my-rank-banner"></div>
    <div id="ranking-list" class="ranking-list"></div>
  </div>
</div>

<!-- ============ 친구 모달 ============ -->
<div id="modal-friend" class="modal hidden">
  <div class="modal-box">
    <div class="modal-header">
      <h3>🤝 친구</h3>
      <button class="modal-close" data-close="modal-friend">✕</button>
    </div>
    <div class="my-code-box">
      <div class="my-code-label">내 초대 코드</div>
      <div class="my-code-row">
        <span id="my-invite-code">------</span>
        <button id="btn-copy-code" class="btn-small">복사</button>
      </div>
    </div>
    <div class="add-friend-box">
      <input id="friend-code-input" type="text" maxlength="6" placeholder="친구 코드 입력" />
      <button id="btn-add-friend" class="btn-small">추가</button>
    </div>
    <div id="friend-msg" class="friend-msg"></div>
    <div id="friend-list" class="friend-list"></div>
  </div>
</div>

<!-- ============ 출석 모달 ============ -->
<div id="modal-daily" class="modal hidden">
  <div class="modal-box">
    <div class="modal-header">
      <h3>🎁 출석 보상</h3>
      <button class="modal-close" data-close="modal-daily">✕</button>
    </div>
    <div id="daily-content" class="daily-content"></div>
  </div>
</div>

<!-- ============ 설정 모달 ============ -->
<div id="modal-settings" class="modal hidden">
  <div class="modal-box">
    <div class="modal-header">
      <h3>⚙️ 설정</h3>
      <button class="modal-close" data-close="modal-settings">✕</button>
    </div>
    <div class="settings-row">
      <span>닉네임</span>
      <div class="settings-nick-edit">
        <input id="settings-nickname" type="text" maxlength="12" />
        <button id="btn-save-nickname" class="btn-small">저장</button>
      </div>
    </div>
    <button id="btn-restart-tutorial" class="btn-secondary btn-full">튜토리얼 다시보기</button>
  </div>
</div>

<!-- ============ 튜토리얼 오버레이 ============ -->
<div id="tutorial-overlay" class="tutorial-overlay hidden">
  <div id="tutorial-spotlight" class="tutorial-spotlight"></div>
  <div id="tutorial-card" class="tutorial-card">
    <div class="tutorial-mascot">🐵</div>
    <div id="tutorial-step-num" class="tutorial-step-num">1 / 8</div>
    <div id="tutorial-text" class="tutorial-text"></div>
    <div class="tutorial-btns">
      <button id="btn-tutorial-skip" class="btn-text">건너뛰기</button>
      <button id="btn-tutorial-next" class="btn-primary">다음</button>
    </div>
  </div>
</div>

<!-- ============ 토스트 ============ -->
<div id="toast" class="toast hidden"></div>

<script src="game.js"></script>
</body>
</html>
